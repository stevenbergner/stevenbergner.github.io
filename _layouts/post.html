---
layout: default
---
<article class="post" itemscope itemtype="http://schema.org/BlogPosting">
  <meta itemprop="name headline" content="{{ page.title | escape }}">
  <meta itemprop="datePublished" content="{{ page.date | date_to_xmlschema }}">
  {% if page.author %}<meta itemprop="author" content="{{ page.author | escape }}">{% endif %}

  <div class="post-content" itemprop="articleBody">
    {% if page.collab %}
    <p>
    Collaboration with:
    {{ page.collab | array_to_sentence_string }}
    </p>
    {% endif %}

{{ content }}
  </div>

  {% if site.disqus.shortname %}
    {% include disqus_comments.html %}
  {% endif %}
</article>
